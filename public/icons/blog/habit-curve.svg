<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="100%" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="t">How a meditation habit forms over time</title>
<desc id="d">Habit automaticity rises quickly in the first weeks and levels off. For the typical person it reaches 95 percent of its plateau at about day 66; the fastest person took 18 days and the slowest about 254. Milestones from research are marked at 4 days, 2 weeks, 4 weeks and 8 weeks.</desc>
<rect width="800" height="470" rx="16" fill="#ffffff"/>
